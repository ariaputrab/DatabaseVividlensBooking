<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jadwal Fotografer - VIVIDLENS</title>
    <link rel="preconnect" href="https://script.google.com">
    <link rel="preconnect" href="https://script.googleusercontent.com">
    <link rel="preconnect" href="https://aizhweokxpxfrczqsuik.supabase.co">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        textarea { font-size: 13px !important; }

        /* ===== Animasi loading ===== */
        #topbar { position: fixed; top: 0; left: 0; right: 0; height: 3px; overflow: hidden; z-index: 50; background: rgba(37,99,235,.15); display: none; }
        #topbar.on { display: block; }
        #topbar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: #2563eb; border-radius: 3px; animation: ld-slide 1.1s ease-in-out infinite; }
        @keyframes ld-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

        .ld-pulse { animation: ld-ring 1.6s ease-out infinite; }
        @keyframes ld-ring {
            0%   { box-shadow: 0 0 0 0 rgba(15,23,42,.35); }
            70%  { box-shadow: 0 0 0 14px rgba(15,23,42,0); }
            100% { box-shadow: 0 0 0 0 rgba(15,23,42,0); }
        }
        .ld-float { animation: ld-float 2.2s ease-in-out infinite; }
        @keyframes ld-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

        .sk { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 37%, #e2e8f0 63%); background-size: 400% 100%; animation: ld-shine 1.4s ease infinite; border-radius: 8px; }
        @keyframes ld-shine { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

        #ldMsg { transition: opacity .2s ease; }
        .fade-in { animation: ld-in .4s ease both; }
        @keyframes ld-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen py-4 px-3 sm:py-8">
<div id="topbar"></div>
<div class="max-w-lg mx-auto space-y-4">

    <div class="bg-gradient-to-r from-slate-900 to-slate-800 text-white p-4 rounded-2xl">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 bg-white/10 rounded-xl flex items-center justify-center"><i class="fa-solid fa-camera"></i></div>
            <div>
                <p class="text-[11px] text-slate-300">VIVIDLENS · Jadwal Fotografer</p>
                <h1 id="hdTitle" class="font-bold text-base leading-tight">Memuat...</h1>
            </div>
        </div>
        <p id="hdDate" class="text-xs text-slate-300 mt-2"></p>
        <p id="syncInfo" class="text-[10px] text-slate-400 mt-1"></p>
    </div>

    <!-- Loader awal: langsung tampil begitu halaman terbuka -->
    <div id="jobList" class="space-y-4">
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex items-center gap-4">
                <div class="ld-pulse w-12 h-12 rounded-2xl bg-slate-900 text-white flex items-center justify-center text-lg flex-none"><i class="fa-solid fa-camera ld-float"></i></div>
                <div class="flex-1 min-w-0">
                    <div class="text-sm font-bold text-slate-800">Menyiapkan jadwal kamu...</div>
                    <div class="text-[11px] text-slate-400 mt-0.5">Biasanya hanya beberapa detik</div>
                </div>
            </div>
            <div class="mt-4 h-1.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-full w-1/4 rounded-full bg-gradient-to-r from-blue-500 to-indigo-500"></div></div>
        </div>
    </div>

    <p class="text-center text-[10px] text-slate-400">VividLens Graduation</p>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbymxf1pIrMhVi77zHolsSVW9gsFLni-xs2kX5zTkbDF-OYX-Jwrb6pqD18g7Vu0kyPw/exec";
    const sb = supabase.createClient(
        "https://aizhweokxpxfrczqsuik.supabase.co",
        "sb_publishable_bEKjQ-KQvs3GZpH0eVaHbw_N0ssNYKp"
    );

    const MON_KEY = { jan:1, feb:2, mar:3, apr:4, mei:5, may:5, jun:6, jul:7, agu:8, agt:8, aug:8, sep:9, okt:10, oct:10, nov:11, des:12, dec:12 };
    const pad = n => String(n).padStart(2, '0');
    const params = new URLSearchParams(location.search);
    const fgName = (params.get('fg') || '').trim();
    const tglParam = (params.get('tgl') || '').trim(); // format YYYY-MM-DD

    window._chats = {};
    window._jobs = {};

    function toISO(raw) {
        if (!raw) return '';
        const s = String(raw).trim();
        if (s.includes('GMT') || isNaN(s[0])) {
            const p = new Date(s);
            if (!isNaN(p)) return `${p.getFullYear()}-${pad(p.getMonth() + 1)}-${pad(p.getDate())}`;
        }
        const parts = s.split(/[\s\-\/\.]+/);
        if (parts.length >= 3) {
            let y = parts[2]; if (y.length === 2) y = '20' + y;
            const m = isNaN(parts[1]) ? (MON_KEY[parts[1].toLowerCase().substring(0, 3)] || 1) : parseInt(parts[1], 10);
            return `${y}-${pad(m)}-${pad(parseInt(parts[0], 10))}`;
        }
        return '';
    }

    function waNumber(c) {
        const str = String(c.noWa || '');
        const m = str.match(/\b(08[0-9]{8,13})\b/) || str.match(/(\+?62[0-9]{9,13})/);
        const raw = m ? m[1] : str;
        return raw.replace(/\D/g, '').replace(/^0/, '62');
    }

    // Nomor WA klien dalam bentuk yang mudah dibaca (08xxxx)
    function waDisplay(c) {
        const str = String(c.noWa || '').trim();
        const m = str.match(/\b(08[0-9]{8,13})\b/) || str.match(/(\+?62[0-9]{9,13})/);
        return m ? m[1] : (str && str !== 'undefined' ? str : '-');
    }

    function copyNum(num, btn) {
        const done = () => { const o = btn.textContent; btn.textContent = 'Tersalin!'; setTimeout(() => btn.textContent = o, 1500); };
        if (navigator.clipboard) navigator.clipboard.writeText(num).then(done);
    }

    function buildChat(c) {
        return `Hallo Kak ${c.nama || '...'}\nPerkenalkan, saya ${fgName} dari tim VividLens Graduation 😊\nIzin konfirmasi kembali untuk jadwal sesi foto Kakak ya:\n\nTanggal : ${c.tanggal || '-'}\nJam : ${c.jam || '-'}\nLokasi : ${c.lokasi || '-'}\nKampus : ${c.kampus || '-'}\nPaket : ${c.paket || '-'}\nWA: ${waDisplay(c)}\n\nApakah sudah sesuai, Kak? 😊 Untuk meeting point-nya di sebelah mana yaa Kak?\nJika ada request pose atau moodboard yang ingin direferensikan, boleh dikirimkan juga yaa ✨\nTerima kasih, Kak 🙏🏻`;
    }

    function copyChat(i, btn) {
        const text = window._chats[i];
        const done = () => { const o = btn.innerHTML; btn.innerHTML = '<i class="fa-solid fa-check mr-1"></i> Tersalin!'; setTimeout(() => btn.innerHTML = o, 1500); };
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => { done(); markCopied(i); });
        else { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); markCopied(i); }
    }

    // Tandai ke admin bahwa fotografer sudah menyalin / memakai format chat
    async function markCopied(i) {
        const j = window._jobs[i];
        if (!j || !j.iso) return;
        try {
            await sb.from('fg_confirm').upsert(
                { nama: j.nama, tanggal: j.iso, fg: fgName, chat_copied_at: new Date().toISOString() },
                { onConflict: 'nama,tanggal' }
            );
        } catch (e) { console.log('fg_confirm error', e); }
    }

    function renderJobs(data) {
        const box = document.getElementById('jobList');
        const jobs = data.jobs || [], driveMap = data.driveMap || {}, noteMap = data.noteMap || {};
        window._chats = {};
        window._jobs = {};
        if (jobs.length === 0) {
            box.innerHTML = '<div class="fade-in p-8 bg-white border border-slate-200 rounded-2xl text-center text-xs text-slate-400">Tidak ada jadwal untuk kamu pada tanggal ini.</div>';
            return;
        }
        box.innerHTML = jobs.map((c, i) => {
            const chat = buildChat(c);
            window._chats[i] = chat;
            window._jobs[i] = { nama: c.nama, iso: c.iso };
            const drive = driveMap[(c.nama || '').toLowerCase().trim()];
            const note = noteMap[(c.nama || '').toLowerCase().trim() + '|' + c.iso];
            const waShow = waDisplay(c);
            const wa = waNumber(c);
            return `
            <div class="fade-in bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3" style="animation-delay:${i * 90}ms">
                <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-800">⏰ ${c.jam || '-'} WIB</span>
                    ${tglParam ? '' : `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-700">${c.tanggal || '-'}</span>`}
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-700">Sesi ${i + 1}</span>
                </div>
                <div>
                    <h2 class="font-bold text-base text-slate-900">${c.nama || '-'}</h2>
                    <p class="text-xs text-slate-500">${c.kampus || 'Umum'} • Paket ${c.paket || '-'}</p>
                </div>
                <p class="text-xs text-slate-600"><i class="fa-solid fa-location-dot text-rose-500 mr-1"></i> ${c.lokasi || '-'}</p>

                ${waShow !== '-' ? `<div class="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs"><span class="text-slate-500">No. WA klien: <b class="text-slate-800">${waShow}</b></span><button onclick="copyNum('${waShow}', this)" class="font-bold text-blue-600">Salin Nomor</button></div>` : ''}

                ${note ? `<div class="bg-amber-50 border border-amber-200 text-amber-900 rounded-xl px-3 py-2 text-xs leading-relaxed"><b class="block text-[10px] uppercase tracking-wide">📌 Catatan dari admin</b>${String(note).replace(/</g, '&lt;')}</div>` : ''}

                ${drive
                    ? `<a href="${drive}" target="_blank" class="flex items-center justify-center gap-2 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl"><i class="fa-brands fa-google-drive"></i> Buka Folder Google Drive</a>`
                    : `<div class="py-2.5 text-center bg-slate-50 border border-dashed border-slate-300 text-slate-400 text-xs rounded-xl">Folder Drive belum dibuat admin</div>`}

                <div class="space-y-2 pt-2 border-t border-slate-100">
                    <span class="text-[10px] font-bold uppercase text-slate-400 block">Format chat konfirmasi ke klien</span>
                    <textarea readonly rows="9" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 outline-none resize-none leading-relaxed">${chat}</textarea>
                    <div class="flex gap-2">
                        <button onclick="copyChat(${i}, this)" class="flex-1 py-2.5 bg-slate-900 hover:bg-black text-white font-bold text-xs rounded-xl active:scale-95"><i class="fa-solid fa-copy mr-1"></i> Salin Chat</button>
                        ${wa ? `<a href="https://wa.me/${wa}?text=${encodeURIComponent(chat)}" target="_blank" onclick="markCopied(${i})" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl text-center active:scale-95"><i class="fa-brands fa-whatsapp mr-1"></i> Kirim via WA</a>` : ''}
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    // ================= LOADING =================
    let ldTimer = null;

    // Kartu loading + kerangka kartu (bentuknya sama dengan kartu jadwal asli)
    function loaderHtml() {
        const skeleton = `
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
            <div class="flex gap-1.5"><div class="sk h-5 w-28"></div><div class="sk h-5 w-14"></div></div>
            <div><div class="sk h-5 w-2/3"></div><div class="sk h-3 w-1/2 mt-2"></div></div>
            <div class="sk h-3 w-2/5"></div>
            <div class="sk h-9"></div>
            <div class="sk h-10"></div>
            <div class="pt-2 border-t border-slate-100 space-y-2"><div class="sk h-3 w-1/2"></div><div class="sk h-32"></div>
                <div class="flex gap-2"><div class="sk h-10 flex-1"></div><div class="sk h-10 flex-1"></div></div></div>
        </div>`;
        return `
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex items-center gap-4">
                <div class="ld-pulse w-12 h-12 rounded-2xl bg-slate-900 text-white flex items-center justify-center text-lg flex-none"><i class="fa-solid fa-camera ld-float"></i></div>
                <div class="flex-1 min-w-0">
                    <div id="ldMsg" class="text-sm font-bold text-slate-800">Menyiapkan jadwal kamu...</div>
                    <div class="text-[11px] text-slate-400 mt-0.5">Biasanya hanya beberapa detik</div>
                </div>
            </div>
            <div class="mt-4 h-1.5 rounded-full bg-slate-100 overflow-hidden"><div id="ldBar" class="h-full rounded-full bg-gradient-to-r from-blue-500 to-indigo-500" style="width:4%;transition:width .4s ease"></div></div>
        </div>` + skeleton;
    }

    // Bar bergerak halus mendekati 92%, pesan ramah berganti seiring waktu
    function startLoading() {
        const steps = [
            [0, 'Menyiapkan jadwal kamu...'],
            [2500, 'Mengambil data sesi...'],
            [6000, 'Menyiapkan format chat klien...'],
            [10000, 'Server agak lambat, tunggu sebentar ya 🙏'],
            [18000, 'Hampir selesai, koneksi sedang lambat...']
        ];
        const t0 = Date.now();
        clearInterval(ldTimer);
        ldTimer = setInterval(() => {
            const dt = Date.now() - t0;
            const pct = 92 * (1 - Math.exp(-dt / 6000));
            const bar = document.getElementById('ldBar');
            if (bar) bar.style.width = pct.toFixed(1) + '%';
            const msg = document.getElementById('ldMsg');
            if (msg) {
                let t = steps[0][1];
                steps.forEach(s => { if (dt >= s[0]) t = s[1]; });
                if (msg.textContent !== t) {
                    msg.style.opacity = 0;
                    setTimeout(() => { msg.textContent = t; msg.style.opacity = 1; }, 200);
                }
            }
        }, 200);
    }

    // Penuhkan bar sebentar sebelum menampilkan kartu, supaya terasa "selesai"
    async function finishLoading(showedLoader) {
        clearInterval(ldTimer);
        const bar = document.getElementById('ldBar');
        if (showedLoader && bar) {
            bar.style.width = '100%';
            await new Promise(r => setTimeout(r, 260));
        }
        const top = document.getElementById('topbar');
        if (top) top.classList.remove('on');
    }

    function showSync(text) {
        const el = document.getElementById('syncInfo');
        if (el) el.textContent = text || '';
    }

    function errorHtml() {
        return `<div class="fade-in bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-center space-y-3">
            <div class="w-12 h-12 mx-auto rounded-2xl bg-rose-50 text-rose-500 flex items-center justify-center text-lg"><i class="fa-solid fa-wifi"></i></div>
            <div><div class="text-sm font-bold text-slate-800">Jadwal belum bisa dimuat</div>
            <div class="text-xs text-slate-500 mt-0.5">Koneksi atau server sedang lambat.</div></div>
            <button onclick="location.reload()" class="px-4 py-2 bg-slate-900 hover:bg-black text-white font-bold text-xs rounded-xl active:scale-95"><i class="fa-solid fa-rotate-right mr-1"></i> Coba lagi</button>
        </div>`;
    }

    async function init() {
        const box = document.getElementById('jobList');
        if (!fgName) {
            document.getElementById('hdTitle').textContent = 'Link tidak valid';
            box.innerHTML = '<div class="p-6 bg-white border border-slate-200 rounded-2xl text-center text-xs text-slate-500">Link ini belum berisi nama fotografer. Minta link terbaru ke admin ya.</div>';
            return;
        }
        document.getElementById('hdTitle').textContent = `Halo, ${fgName}! 👋`;

        const now = new Date();
        const todayISO = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
        if (tglParam) {
            const d = new Date(tglParam + 'T00:00:00');
            document.getElementById('hdDate').textContent = 'Jadwal sesi: ' + d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        } else {
            document.getElementById('hdDate').textContent = 'Semua jadwal sesi kamu yang akan datang';
        }

        // 1) Tampilkan data tersimpan lebih dulu (instan), lalu perbarui di latar belakang
        const cacheKey = `vl_fg_${fgName.toLowerCase()}_${tglParam || 'all'}`;
        let hasCache = false;
        try {
            const raw = JSON.parse(localStorage.getItem(cacheKey) || 'null');
            if (raw && raw.data && (Date.now() - raw.t) < 24 * 3600 * 1000) {
                renderJobs(raw.data);
                hasCache = true;
                showSync('Memperbarui data...');
            }
        } catch (e) {}

        // Garis biru di atas layar selalu berjalan selama data dimuat
        document.getElementById('topbar').classList.add('on');
        if (!hasCache) { box.innerHTML = loaderHtml(); startLoading(); }

        // 2) Ambil data terbaru
        try {
            const [res, drv, nts] = await Promise.all([
                fetch(SCRIPT_URL).then(r => r.json()),
                sb.from('clients').select('nama, drive_link').limit(1000),
                sb.from('fg_confirm').select('nama, tanggal, note').not('note', 'is', null)
            ]);
            const clients = (res && res.clients) ? res.clients : [];
            const driveMap = {};
            (drv.data || []).forEach(r => { if (r.nama && r.drive_link) driveMap[r.nama.toLowerCase().trim()] = r.drive_link; });
            const noteMap = {};
            (nts.data || []).forEach(r => { if (r.nama && r.note && r.note.trim()) noteMap[r.nama.toLowerCase().trim() + '|' + r.tanggal] = r.note; });

            const jobs = clients
                .filter(c => (c.fg || '').toLowerCase().trim() === fgName.toLowerCase())
                .map(c => ({ ...c, iso: toISO(c.tanggal) }))
                .filter(c => tglParam ? c.iso === tglParam : c.iso >= todayISO)
                .sort((a, b) => a.iso.localeCompare(b.iso) || (a.jam || '').localeCompare(b.jam || ''));

            const data = { jobs, driveMap, noteMap };
            await finishLoading(!hasCache);
            renderJobs(data);
            try { localStorage.setItem(cacheKey, JSON.stringify({ t: Date.now(), data })); } catch (e) {}
            showSync('');
        } catch (e) {
            await finishLoading(false);
            if (!hasCache) box.innerHTML = errorHtml();
            else showSync('Tidak bisa memperbarui, menampilkan data terakhir.');
        }
    }

    init();
</script>
</body>
</html>
