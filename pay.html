<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tagihan Pelunasan - VIVIDLENS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-8 px-4 flex items-center justify-center">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700/80 rounded-3xl p-6 shadow-2xl space-y-6">
        
        <!-- Header Brand -->
        <div class="text-center space-y-2 border-b border-slate-700 pb-5">
            <div class="w-12 h-12 bg-white text-slate-900 rounded-2xl flex items-center justify-center mx-auto text-xl font-bold shadow-lg">
                <i class="fa-solid fa-camera"></i>
            </div>
            <div>
                <h1 class="text-lg font-black tracking-tight text-white">VIVIDLENS GRADUATION</h1>
                <p class="text-xs text-slate-400">Portal Tagihan & Konfirmasi Pelunasan</p>
            </div>
        </div>

        <!-- Container Informasi Klien & Tagihan -->
        <div id="contentContainer" class="space-y-4">
            <div class="p-8 text-center text-slate-400 text-xs">
                <i class="fa-solid fa-spinner fa-spin text-xl text-emerald-400 mb-2 block"></i>
                Memuat rincian tagihan...
            </div>
        </div>

        <div class="text-center text-[10px] text-slate-500 pt-2">
            Terima kasih telah mempercayakan dokumentasi kelulusan Anda bersama VividLens.
        </div>
    </div>

    <script>
        // Menggunakan file qris.png yang ada di folder yang sama
        const QRIS_IMAGE_URL = "qris.png"; 
        const ADMIN_WA_NUMBER = "6282225000000"; // Ganti dengan nomor WhatsApp admin kamu (format 62...)

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const clientName = params.get('nama');

            if (!clientName) {
                showError("Link tagihan tidak valid atau nama klien tidak ditemukan.");
                return;
            }

            fetchClientBillData(clientName);
        });

        async function fetchClientBillData(namaKlien) {
            const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbymxf1pIrMhVi77zHolsSVW9gsFLni-xs2kX5zTkbDF-OYX-Jwrb6pqD18g7Vu0kyPw/exec";
            
            try {
                const res = await fetch(DEFAULT_SCRIPT_URL);
                const data = await res.json();
                
                if (data && data.status === 'success' && data.clients) {
                    const client = data.clients.find(c => c.nama.toLowerCase().trim() === decodeURIComponent(namaKlien).toLowerCase().trim());
                    
                    if (client) {
                        renderBillCard(client);
                    } else {
                        showError("Data tagihan untuk nama tersebut tidak ditemukan.");
                    }
                } else {
                    throw new Error("Gagal memuat data dari server.");
                }
            } catch (err) {
                showError("Terjadi kesalahan koneksi saat memuat tagihan.");
            }
        }

        function renderBillCard(c) {
            const container = document.getElementById('contentContainer');
            const harga = parseInt(c.harga) || 350000;
            const dp = parseInt(c.dp) || 100000;
            const isLunas = (c.payment || '').toUpperCase().trim() === 'LUNAS';
            const sisa = isLunas ? 0 : Math.max(0, harga - dp);

            if (isLunas) {
                container.innerHTML = `
                    <div class="bg-emerald-950/40 border border-emerald-500/40 rounded-2xl p-6 text-center space-y-3">
                        <div class="w-14 h-14 bg-emerald-500 text-slate-900 rounded-full flex items-center justify-center mx-auto text-2xl font-bold shadow-lg">
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <div class="space-y-1">
                            <h2 class="font-bold text-base text-white">Status: LUNAS</h2>
                            <p class="text-xs text-emerald-400">Pembayaran untuk ${c.nama} telah diverifikasi.</p>
                        </div>
                        <div class="pt-2 text-xs text-slate-300 bg-slate-900/50 p-3 rounded-xl">
                            Sampai jumpa di sesi photoshoot nanti ya Kak! ✨
                        </div>
                    </div>
                `;
                return;
            }

            const waMsg = `Halo Admin VividLens, saya ${c.nama} (${c.paket}) ingin konfirmasi pembayaran pelunasan sebesar Rp${sisa.toLocaleString('id-ID')}. Berikut bukti transfernya ya Kak: [Lampirkan Foto/Screenshot]`;
            const waLink = `https://wa.me/${ADMIN_WA_NUMBER}?text=${encodeURIComponent(waMsg)}`;

            container.innerHTML = `
                <!-- Rincian Klien -->
                <div class="bg-slate-900/60 border border-slate-700/60 rounded-2xl p-4 space-y-2 text-xs">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span class="text-slate-400">Nama Klien</span>
                        <span class="font-bold text-white text-sm">${c.nama}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-slate-400">Paket Wisuda</span>
                        <span class="font-bold text-emerald-400">${c.paket} (${c.kampus || 'Umum'})</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-slate-400">Jadwal Sesi</span>
                        <span class="font-bold text-slate-200">${c.tanggal} • ${c.jam || '-'} WIB</span>
                    </div>
                </div>

                <!-- Rincian Harga & Sisa Tagihan -->
                <div class="bg-slate-900/80 border border-slate-700 rounded-2xl p-4 space-y-2 text-xs">
                    <div class="flex justify-between text-slate-400">
                        <span>Total Harga Paket</span>
                        <span>Rp${harga.toLocaleString('id-ID')}</span>
                    </div>
                    <div class="flex justify-between text-emerald-400 border-b border-slate-800 pb-2">
                        <span>DP Terbayar (Booking Fee)</span>
                        <span>- Rp${dp.toLocaleString('id-ID')}</span>
                    </div>
                    <div class="flex justify-between items-center pt-1">
                        <span class="font-bold text-white text-sm">Sisa Pelunasan H-1</span>
                        <span class="font-black text-amber-400 text-base">Rp${sisa.toLocaleString('id-ID')}</span>
                    </div>
                </div>

                <!-- QRIS Pembayaran -->
                <div class="bg-white rounded-2xl p-4 text-center space-y-3 shadow-inner">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-slate-600 block">Scan QRIS VIVIDLENS PHOTOGRAPHY</span>
                    <div class="w-52 h-52 mx-auto bg-slate-50 border border-slate-200 rounded-xl p-1.5 flex items-center justify-center overflow-hidden">
                        <img src="${QRIS_IMAGE_URL}" alt="QRIS VividLens" class="w-full h-full object-contain rounded-lg">
                    </div>
                    <p class="text-[10px] text-slate-500">Scan pakai m-banking atau e-wallet apa saja (BCA, Mandiri, BRI, GoPay, Dana, dll)</p>
                </div>

                <!-- Tombol Konfirmasi WA -->
                <a href="${waLink}" target="_blank" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold text-xs rounded-2xl transition flex items-center justify-center gap-2 shadow-lg">
                    <i class="fa-brands fa-whatsapp text-base"></i> Konfirmasi Pelunasan via WhatsApp
                </a>
            `;
        }

        function showError(msg) {
            document.getElementById('contentContainer').innerHTML = `
                <div class="p-6 bg-rose-950/40 border border-rose-500/40 rounded-2xl text-center space-y-2 text-xs text-rose-300">
                    <i class="fa-solid fa-triangle-exclamation text-2xl text-rose-500 mb-1 block"></i>
                    <p class="font-bold">${msg}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
