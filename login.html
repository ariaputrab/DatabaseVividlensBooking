<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - VIVIDLENS Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        /* Efek cahaya latar belakang sinematik */
        .bg-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(147, 51, 234, 0.15));
            filter: blur(80px);
            border-radius: 50%;
            z-index: 0;
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Elemen Cahaya Estetik di Latar Belakang -->
    <div class="bg-glow -top-20 -left-20"></div>
    <div class="bg-glow -bottom-20 -right-20"></div>

    <!-- Kotak Kartu Login Utama -->
    <div class="w-full max-w-md bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 p-8 sm:p-10 rounded-[2.5rem] shadow-2xl relative z-10 space-y-7">
        
        <!-- Logo & Judul Studio -->
        <div class="text-center space-y-3">
            <div class="w-14 h-14 bg-gradient-to-tr from-blue-600 to-indigo-500 text-white rounded-2xl flex items-center justify-center mx-auto text-xl shadow-lg shadow-blue-500/20 border border-blue-400/20 transform hover:scale-105 transition duration-300">
                <i class="fa-solid fa-camera-retro"></i>
            </div>
            <div class="space-y-1">
                <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-white">VIVIDLENS</h1>
                <p class="text-xs font-medium text-slate-400 tracking-wide uppercase">Graduation & Portrait Portal</p>
            </div>
        </div>

        <!-- Alert Pesan Error (Tersembunyi secara default) -->
        <div id="errorBox" class="hidden p-3.5 bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs rounded-2xl flex items-center gap-3 animate-shake">
            <i class="fa-solid fa-circle-exclamation text-sm flex-shrink-0"></i>
            <span id="errorText">Email atau password salah!</span>
        </div>

        <!-- Form Login -->
        <form id="loginForm" class="space-y-5">
            <div class="space-y-2">
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 pl-1">Email / Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500">
                        <i class="fa-regular fa-envelope text-xs"></i>
                    </span>
                    <input type="text" id="email" required 
                           class="w-full pl-11 pr-4 py-3.5 bg-slate-950/60 border border-slate-800/80 rounded-2xl text-xs sm:text-sm text-white outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition duration-200 placeholder:text-slate-600" 
                           placeholder="admin@vividlens.com">
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 pl-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500">
                        <i class="fa-regular fa-lock text-xs"></i>
                    </span>
                    <input type="password" id="password" required 
                           class="w-full pl-11 pr-4 py-3.5 bg-slate-950/60 border border-slate-800/80 rounded-2xl text-xs sm:text-sm text-white outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition duration-200 placeholder:text-slate-600" 
                           placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="submitBtn" 
                    class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 active:scale-[0.98] font-bold text-xs sm:text-sm rounded-2xl shadow-xl shadow-blue-600/25 transition duration-200 flex items-center justify-center gap-2 text-white">
                <span>Masuk ke Dasbor</span>
                <i class="fa-solid fa-arrow-right-long text-xs"></i>
            </button>
        </form>

        <!-- Footer Kecil -->
        <div class="text-center pt-2 border-t border-slate-800/60">
            <p class="text-[10px] text-slate-500 font-medium">Secure System • VividLens Yogyakarta</p>
        </div>
    </div>

    <script>
        // Cek jika sudah pernah login sebelumnya lewat memori browser (localStorage)
        if (localStorage.getItem('vividlens_logged_in') === 'true') {
            window.location.href = '/index.html';
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');
            const btn = document.getElementById('submitBtn');

            // Efek loading tombol saat diklik
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i><span>Memeriksa...</span>';

            setTimeout(() => {
                // GIMMICK: Password valid diatur ke "vividlens2026"
                if (password === 'vividlens2026' || (email === 'admin' && password === 'admin')) {
                    localStorage.setItem('vividlens_logged_in', 'true');
                    window.location.href = '/index.html';
                } else {
                    errorBox.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerHTML = '<span>Masuk ke Dasbor</span><i class="fa-solid fa-arrow-right-long text-xs"></i>';
                }
            }, 500); // Simulasi jeda setengah detik agar terasa profesional
        });
    </script>
</body>
</html>
