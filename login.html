<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - VIVIDLENS Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-800/80 backdrop-blur-md border border-slate-700/80 p-6 sm:p-8 rounded-3xl shadow-2xl space-y-6">
        
        <!-- Logo & Judul -->
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center mx-auto text-lg font-bold shadow-md border border-slate-700">
                <i class="fa-solid fa-camera"></i>
            </div>
            <div>
                <h1 class="text-lg sm:text-xl font-bold tracking-tight">VIVIDLENS</h1>
                <p class="text-xs text-slate-400">Portal Operasional & Keuangan</p>
            </div>
        </div>

        <!-- Alert Notifikasi / Error -->
        <div id="alertBox" class="hidden p-3 text-xs rounded-xl flex items-center gap-2">
            <i id="alertIcon" class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
            <span id="alertText">Pesan notifikasi</span>
        </div>

        <!-- Form Login -->
        <form id="loginForm" class="space-y-4">
            <div class="space-y-1.5">
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Email Admin</label>
                <input type="email" id="email" required 
                       class="w-full px-3.5 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-xs sm:text-sm text-white outline-none focus:border-blue-500 transition" 
                       placeholder="admin@vividlens.com">
            </div>

            <div class="space-y-1.5">
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Password</label>
                <input type="password" id="password" required 
                       class="w-full px-3.5 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-xs sm:text-sm text-white outline-none focus:border-blue-500 transition" 
                       placeholder="••••••••">
            </div>

            <button type="submit" id="submitBtn" 
                    class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] font-bold text-xs sm:text-sm rounded-xl shadow-lg shadow-blue-600/20 transition flex items-center justify-center gap-2">
                <span>Masuk Dasbor</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Tombol Buat Akun Pertama (Sekali Pakai) -->
        <div id="registerContainer" class="hidden pt-2 border-t border-slate-700/60 text-center">
            <p class="text-[11px] text-slate-400 mb-2">Belum ada akun admin yang terdaftar?</p>
            <button onclick="handleRegisterAdmin()" class="w-full py-2.5 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 font-bold text-xs rounded-xl transition">
                Buat Akun Admin Pertama (1x Saja)
            </button>
        </div>

        <div class="text-center pt-2 border-t border-slate-700/60">
            <p class="text-[10px] text-slate-500">VividLens Graduation & Portrait Photography</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://aizhweokxpxfrczqsuik.supabase.co";
        const SUPABASE_KEY = "sb_publishable_bEKjQ-KQvs3GZpH0eVaHbw_N0ssNYKp";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Cek sesi login & status apakah akun sudah pernah dibuat
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = '/index.html';
                return;
            }

            const { data, error } = await supabaseClient
                .from('admin_status')
                .select('is_created')
                .eq('id', 1)
                .single();

            if (data && data.is_created === false) {
                document.getElementById('registerContainer').classList.remove('hidden');
            }
        });

        // Proses Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            
            setAlert('', true);
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                showAlert(error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<span>Masuk Dasbor</span><i class="fa-solid fa-arrow-right text-xs"></i>';
            } else {
                window.location.href = '/index.html';
            }
        });

        // Fungsi Pendaftaran Akun Pertama (Sekali Pakai)
        async function handleRegisterAdmin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showAlert('Masukkan email dan password terlebih dahulu pada form di atas!', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('Password minimal harus 6 karakter.', 'error');
                return;
            }

            if (!confirm(`Daftarkan email "${email}" sebagai akun admin utama VividLens?`)) return;

            const { data, error } = await supabaseClient.auth.signUp({ email, password });

            if (error) {
                showAlert('Gagal membuat akun: ' + error.message, 'error');
                return;
            }

            await supabaseClient
                .from('admin_status')
                .update({ is_created: true })
                .eq('id', 1);

            alert('Akun admin berhasil dibuat! Silakan klik "Masuk Dasbor" dengan akun tersebut.');
            document.getElementById('registerContainer').classList.add('hidden');
        }

        function showAlert(msg, type) {
            const box = document.getElementById('alertBox');
            const text = document.getElementById('alertText');
            text.textContent = msg;
            if (type === 'error') {
                box.className = "p-3 bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs rounded-xl flex items-center gap-2";
            }
            box.classList.remove('hidden');
        }
    </script>
</body>
</html>
