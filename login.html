<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - VIVIDLENS Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-800/80 backdrop-blur-md border border-slate-700/80 p-6 sm:p-8 rounded-3xl shadow-2xl space-y-6">
        
        <!-- Logo & Judul -->
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center mx-auto text-lg font-bold shadow-md border border-slate-700">
                <i class="fa-solid fa-camera"></i>
            </div>
            <div>
                <h1 class="text-lg sm:text-xl font-bold tracking-tight">VIVIDLENS</h1>
                <p class="text-xs text-slate-400">Portal Operasional & Keuangan</p>
            </div>
        </div>

        <!-- Alert Error -->
        <div id="errorBox" class="hidden p-3 bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs rounded-xl flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
            <span id="errorText">Email atau password salah!</span>
        </div>

        <!-- Form Login -->
        <form id="loginForm" class="space-y-4">
            <div class="space-y-1.5">
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Email Admin</label>
                <input type="text" id="email" required 
                       class="w-full px-3.5 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-xs sm:text-sm text-white outline-none focus:border-blue-500 transition" 
                       placeholder="admin@vividlens.com">
            </div>

            <div class="space-y-1.5">
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Password</label>
                <input type="password" id="password" required 
                       class="w-full px-3.5 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-xs sm:text-sm text-white outline-none focus:border-blue-500 transition" 
                       placeholder="••••••••">
            </div>

            <button type="submit" id="submitBtn" 
                    class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] font-bold text-xs sm:text-sm rounded-xl shadow-lg shadow-blue-600/20 transition flex items-center justify-center gap-2">
                <span>Masuk Dasbor</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-700/60">
            <p class="text-[10px] text-slate-500">VividLens Graduation & Portrait Photography</p>
        </div>
    </div>

    <script>
        // Cek jika sudah pernah login sebelumnya lewat memori browser (localStorage)
        if (localStorage.getItem('vividlens_logged_in') === 'true') {
            window.location.href = '/index.html';
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');

            // GIMMICK: Atur password/email bebas di sini
            // Contoh: Email apa saja bebas asalkan password-nya "vividlens2026"
            if (password === 'vividlens2026' || (email === 'admin' && password === 'admin')) {
                // Simpan status login di memori browser
                localStorage.setItem('vividlens_logged_in', 'true');
                window.location.href = '/index.html';
            } else {
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
